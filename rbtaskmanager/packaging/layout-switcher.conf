# /etc/rb-taskmanager/layout-switcher.conf  (shell syntax, read by rb-layout-switcher)
#
# Modes:  0 = A full   1 = B full   2 = C full   3 = A|B split (only if ENABLE_COMBI=1)
# A window matches when it equals APP_X_ID (exact Wayland app-id) AND contains
# APP_X_TITLE (title substring); leave one of the two empty to ignore it.
# If no window matches, APP_X_CMD is started and the layout is applied as soon
# as the window appears (up to LAUNCH_TIMEOUT seconds).
# To list app-ids and titles of open windows:
#   curl -s http://127.0.0.1:8080/api/status
# VERIFY the *_ID values below on the target before relying on them.

# A: Waydroid full UI
APP_A_ID="Waydroid"
APP_A_TITLE=""
APP_A_CMD="waydroid show-full-ui"

# B: RB-01 remote screen in Chromium
APP_B_ID="chrome-192.168.10.1__RB-01-Default"
APP_B_TITLE=""
APP_B_CMD="/opt/rb-taskmanager/bin/rb-launch-chromium http://192.168.10.1/RB-01"

# C: second RB-01 screen (adjust URL and ID)
APP_C_ID="chrome-192.168.10.1__-Default"
APP_C_TITLE=""
APP_C_CMD="/opt/rb-taskmanager/bin/rb-launch-chromium http://192.168.10.1/"

# Split mode: width of A (left) in pixels; B gets the rest.
# For "Waydroid 75%" set this to 0.75 x output width (e.g. 600 on an 800 px wide screen).
SPLIT_X=600
ENABLE_COMBI=1

# Top button
LABEL_A="A"
LABEL_B="B"
LABEL_C="C"
LABEL_COMBI="S"
BUTTON_X=10
BUTTON_Y=10
BUTTON_W=48
BUTTON_H=32
HIDDEN=0

LAUNCH_TIMEOUT=20
VERBOSE=0

# Power actions for /api/shutdown and /api/reboot. shutdown.sh (package
# rb-taskmanager-onlyserver) stops Waydroid and RB-01 before halting.
SHUTDOWN_CMD="/opt/rb-taskmanager/bin/shutdown.sh"
REBOOT_CMD="/usr/bin/sudo /usr/sbin/reboot"

# HTTP API. rb-taskmanager-onlyserver forwards /api/mode/N here (see its mode.sh),
# so it only needs to listen on localhost.
API_BIND="127.0.0.1"
API_PORT=8080
